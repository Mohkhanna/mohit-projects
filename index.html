<meta charset="utf-8">
<title>Sandbox Database</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-height workbench — explorer (left) beside tabbed query editor / table viewer, status bar below */
:root {
  --bg: #f1f4f7; --panel: #ffffff; --sunk: #eef1f4; --ink: #16202b; --muted: #5a6778; --line: #d9dfe6;
  --accent: #0b7480; --accent-ink: #ffffff; --accent-soft: #dff0f1;
  --ok: #1d7a45; --ok-soft: #e1f3e8; --err: #b3322a; --err-soft: #fbe6e4; --warn: #9a6a00; --null: #8c98a8;
  --syn-k: #7b3fc4; --syn-s: #1d7a45; --syn-n: #b05a00; --syn-c: #8c98a8; --syn-id: #0b6b9c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --panel: #151c23; --sunk: #10161c; --ink: #e2e8ee; --muted: #8d9aaa; --line: #26313c;
    --accent: #43c0c9; --accent-ink: #062226; --accent-soft: #123338;
    --ok: #5ccf8a; --ok-soft: #12301f; --err: #f07a70; --err-soft: #3a1714; --warn: #e0b14a; --null: #5d6a78;
    --syn-k: #c39bff; --syn-s: #7fd99e; --syn-n: #f0b06a; --syn-c: #5d6a78; --syn-id: #6cc4f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --panel: #151c23; --sunk: #10161c; --ink: #e2e8ee; --muted: #8d9aaa; --line: #26313c;
  --accent: #43c0c9; --accent-ink: #062226; --accent-soft: #123338;
  --ok: #5ccf8a; --ok-soft: #12301f; --err: #f07a70; --err-soft: #3a1714; --warn: #e0b14a; --null: #5d6a78;
  --syn-k: #c39bff; --syn-s: #7fd99e; --syn-n: #f0b06a; --syn-c: #5d6a78; --syn-id: #6cc4f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; display: flex; flex-direction: column; gap: 10px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn.danger { color: var(--err); }
.btn[disabled] { opacity: .5; cursor: default; }
input[type=text], input[type=number], select, textarea.field { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--sunk); min-width: 0; }

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.brand b { font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: var(--accent); color: var(--accent-ink); padding: 2px 6px; border-radius: 4px; }
.bar .grow { flex: 1; }
#toggle-explorer { display: none; }

.wb { flex: 1; min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; min-height: 0; }

/* explorer */
.explorer { display: flex; flex-direction: column; overflow: hidden; }
.ex-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ex-head .grow { flex: 1; }
.ex-filter { padding: 8px 10px 0; }
.ex-filter input { width: 100%; }
#tree { overflow: auto; padding: 8px 6px 10px; flex: 1; }
.grp { padding: 8px 6px 4px; }
.node { border-radius: 6px; }
.node-row { display: flex; align-items: center; gap: 2px; border-radius: 6px; }
.node-row:hover { background: var(--sunk); }
.node-row.cur { background: var(--accent-soft); }
.chev { background: none; border: 0; width: 22px; height: 24px; color: var(--muted); font-size: 11px; padding: 0; flex: none; }
.node-name { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 3px 4px; font-family: var(--font-mono); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-right: 6px; }
.node-body { margin: 0 0 6px 24px; padding-left: 8px; border-left: 1px solid var(--line); }
.col-row { display: flex; justify-content: space-between; gap: 8px; width: 100%; background: none; border: 0; text-align: left; padding: 1px 4px; font-family: var(--font-mono); font-size: 12px; border-radius: 4px; }
.col-row:hover { background: var(--sunk); }
.col-row .t { color: var(--muted); }
.col-row .pk { color: var(--accent); }
.node-acts { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 0 6px; }
.empty-ex { padding: 14px 12px; color: var(--muted); font-size: 13px; }

/* main */
.main { display: flex; flex-direction: column; overflow: hidden; }
.tabstrip { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--sunk); overflow-x: auto; flex: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 4px 0 12px; border-right: 1px solid var(--line); background: none; border-top: 0; border-left: 0; border-bottom: 2px solid transparent; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); border-bottom-color: var(--accent); }
.tab .ttl { background: none; border: 0; padding: 8px 0; }
.tab .ico { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.tab .x { background: none; border: 0; color: var(--muted); width: 22px; height: 22px; border-radius: 4px; line-height: 1; }
.tab .x:hover { background: var(--line); color: var(--ink); }
.tab-add { background: none; border: 0; padding: 0 12px; font-size: 17px; color: var(--muted); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.qbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 10px; border-bottom: 1px solid var(--line); flex: none; }
.qbar .grow { flex: 1; }
.kbd { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

/* editor */
.edwrap { display: flex; background: var(--sunk); flex: 0 0 var(--edh, 340px); min-height: 90px; overflow: hidden; }
.gutter { font: 13.5px/21px var(--font-mono); color: var(--null); text-align: right; padding: 10px 8px 10px 12px; user-select: none; white-space: pre; border-right: 1px solid var(--line); overflow: hidden; flex: none; }
.code { position: relative; flex: 1; min-width: 0; }
.code pre, .code textarea { margin: 0; padding: 10px 12px; font: 13.5px/21px var(--font-mono); white-space: pre; tab-size: 2; letter-spacing: 0; border: 0; }
.code pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.code textarea { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; overflow: auto; }
.code textarea::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.code i { font-style: normal; }
.code .k { color: var(--syn-k); font-weight: 500; } .code .s { color: var(--syn-s); } .code .n { color: var(--syn-n); } .code .c { color: var(--syn-c); } .code .id { color: var(--syn-id); }
.split { height: 7px; background: var(--sunk); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: row-resize; flex: none; touch-action: none; }
.split:hover, .split.drag { background: var(--accent-soft); }
.out { flex: 1; min-height: 100px; display: flex; flex-direction: column; }
.outtabs { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.outtabs .pill { background: none; border: 0; border-radius: 12px; padding: 2px 10px; color: var(--muted); font-weight: 500; font-size: 13px; }
.outtabs .pill[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.outtabs .grow { flex: 1; }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.outbody { flex: 1; overflow: auto; min-height: 0; }
.empty { padding: 26px; color: var(--muted); text-align: center; }

table.grid { border-collapse: collapse; font: 12.5px var(--font-mono); font-variant-numeric: tabular-nums; width: max-content; min-width: 100%; }
.grid th, .grid td { padding: 4px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
.grid th { position: sticky; top: 0; background: var(--panel); font-weight: 500; color: var(--muted); z-index: 1; user-select: none; }
.grid th.sortable { cursor: pointer; } .grid th.sortable:hover { color: var(--ink); }
.grid td.num { text-align: right; }
.grid .nul { color: var(--null); font-style: italic; }
.grid tr:hover td { background: var(--sunk); }
.grid td.edit { cursor: cell; }
.grid td input { width: 100%; min-width: 120px; font: inherit; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 3px; background: var(--panel); }
.grid .rn { color: var(--null); text-align: right; width: 1%; padding-right: 6px; }
.grid .del { background: none; border: 0; color: var(--null); padding: 0 4px; border-radius: 4px; }
.grid .del:hover { color: var(--err); background: var(--err-soft); }
.grid tr.ins td { background: var(--accent-soft); }
.grid tr.ins input { width: 100%; min-width: 90px; font: inherit; padding: 2px 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.msgs { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; font: 12.5px var(--font-mono); }
.msgs .ok { color: var(--ok); } .msgs .err { color: var(--err); background: var(--err-soft); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; } .msgs .t { color: var(--muted); }
.rs-cap { padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--sunk); border-bottom: 1px solid var(--line); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.hist button { width: 100%; text-align: left; font: 12px var(--font-mono); background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* table view */
.tv-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
.tv-head h2 { margin: 0; font: 600 15px var(--font-mono); }
.badge { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; color: var(--muted); }
.tv-head .grow { flex: 1; }
.tv-body { flex: 1; overflow: auto; min-height: 0; }
.tv-foot { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); flex: none; }
.sec { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0; }
.sec pre { margin: 0; font: 12.5px/1.5 var(--font-mono); background: var(--sunk); padding: 10px; border-radius: 6px; overflow: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }

footer.status { display: flex; gap: 14px; flex-wrap: wrap; font: 12px var(--font-mono); color: var(--muted); flex: none; }
footer.status .grow { flex: 1; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }

/* dialogs */
.modal { position: fixed; inset: 0; background: rgba(8, 12, 16, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(720px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { margin: 0; font: 700 17px var(--font-display); }
.dlg-h .x { background: none; border: 0; font-size: 20px; color: var(--muted); }
.dlg-b { padding: 14px 16px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.dlg label.l { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.desg { width: 100%; border-collapse: collapse; font-size: 13px; }
.desg th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 2px 4px; font-weight: 600; }
.desg td { padding: 3px 4px; }
.desg input[type=text], .desg select { width: 100%; font-family: var(--font-mono); font-size: 12.5px; }
.dlg-scroll { overflow-x: auto; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.dlg pre.sqlprev { margin: 0; font: 12.5px/1.5 var(--font-mono); background: var(--sunk); padding: 10px; border-radius: 6px; overflow: auto; }
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.choice button { text-align: left; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.choice button:hover { border-color: var(--accent); }
.choice b { font-weight: 600; } .choice span { color: var(--muted); font-size: 12.5px; }

@media (max-width: 860px) {
  html, body { height: auto; min-height: 100%; }
  .wb { grid-template-columns: minmax(0, 1fr); flex: none; }
  .explorer { display: none; max-height: 320px; }
  body.show-ex .explorer { display: flex; }
  #toggle-explorer { display: inline-block; }
  .main { min-height: 640px; }
  .edwrap { flex-basis: var(--edh, 260px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar">
  <div class="brand"><b>DB</b>Sandbox Database</div>
  <button class="btn" id="toggle-explorer">Explorer</button>
  <button class="btn primary" id="b-new">＋ New table</button>
  <button class="btn" id="b-import">Import data</button>
  <button class="btn" id="b-dump">Export SQL</button>
  <button class="btn" id="b-sample">Sample databases</button>
</div>

<div class="wb">
  <aside class="panel explorer">
    <div class="ex-head"><span class="eyebrow grow">Explorer</span><button class="btn sm" id="ex-refresh" title="Refresh">Refresh</button></div>
    <div class="ex-filter"><input type="text" id="ex-filter" placeholder="Filter tables…" aria-label="Filter tables"></div>
    <div id="tree"></div>
  </aside>

  <section class="panel main">
    <div class="tabstrip" id="tabstrip" role="tablist"></div>

    <div class="view" id="qview">
      <div class="qbar">
        <button class="btn primary" id="run">Run ▸</button>
        <button class="btn" id="explain">Explain</button>
        <button class="btn" id="clear">Clear</button>
        <span class="grow"></span>
        <span class="kbd">Ctrl/⌘+Enter runs · selection runs alone</span>
      </div>
      <div class="edwrap" id="edwrap">
        <div class="gutter" id="gutter">1</div>
        <div class="code"><pre id="hl" aria-hidden="true"></pre><textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL editor"></textarea></div>
      </div>
      <div class="split" id="split" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
      <div class="out">
        <div class="outtabs" role="tablist">
          <button class="pill" role="tab" data-o="results" aria-selected="true">Results</button>
          <button class="pill" role="tab" data-o="messages" aria-selected="false">Messages</button>
          <button class="pill" role="tab" data-o="history" aria-selected="false">History</button>
          <span class="grow"></span>
          <span class="meta" id="outmeta"></span>
          <button class="btn sm" id="copy-csv" hidden>Copy as CSV</button>
        </div>
        <div class="outbody" id="outbody"></div>
      </div>
    </div>

    <div class="view" id="tview" hidden></div>
  </section>
</div>

<footer class="status">
  <span><span class="dot"></span>Connected to <b>sandbox.db</b> (in your browser)</span>
  <span id="st-ver"></span>
  <span class="grow" id="st-msg"></span>
  <span id="st-saved"></span>
</footer>

<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <div class="dlg-h"><h2 id="dlg-title"></h2><button class="x" id="dlg-x" aria-label="Close">×</button></div>
  <div class="dlg-b" id="dlg-body"></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const q = n => '"' + String(n).replace(/"/g, '""') + '"';
const lit = v => v === null || v === undefined ? 'NULL' : typeof v === 'number' ? String(v) : v instanceof Uint8Array ? "X'" + [...v].map(b => b.toString(16).padStart(2, '0')).join('') + "'" : "'" + String(v).replace(/'/g, "''") + "'";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { } },
};
let SQL, db;

/* ---------- persistence (IndexedDB) ---------- */
const idbOpen = () => new Promise((res, rej) => { const r = indexedDB.open('sandboxdb', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbGet = async k => { const d = await idbOpen(); return new Promise((res, rej) => { const t = d.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); };
const idbSet = async (k, v) => { const d = await idbOpen(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
let saveT;
function scheduleSave() { clearTimeout(saveT); $('#st-saved').textContent = 'saving…'; saveT = setTimeout(async () => { try { await idbSet('db', db.export()); db.run('PRAGMA foreign_keys = ON'); $('#st-saved').textContent = 'saved'; } catch { $('#st-saved').textContent = 'not saved (browser storage unavailable)'; } }, 400); }
const say = t => { $('#st-msg').textContent = t; };

/* ---------- db helpers ---------- */
const rowsOf = sql => { const r = db.exec(sql); return r.length ? r[0].values : []; };
const scalar = sql => { const r = rowsOf(sql); return r.length ? r[0][0] : null; };
function listObjects() { return rowsOf("SELECT name, type FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY type, name"); }
const tableExists = n => scalar(`SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name = ${lit(n)}`) === 1;
function tableInfo(name) {
  const m = rowsOf(`SELECT type, sql FROM sqlite_master WHERE name = ${lit(name)}`)[0] || [];
  const cols = rowsOf(`PRAGMA table_info(${q(name)})`).map(c => ({ name: c[1], type: c[2], nn: !!c[3], def: c[4], pk: c[5] }));
  return { isView: m[0] === 'view', sql: m[1] || '', cols };
}
const isNumType = t => /int|real|num|doub|float|dec|bool/i.test(t || '');
function parseVal(str, type) {
  if (str === 'NULL') return null;
  if (isNumType(type) && /^-?\d+(\.\d+)?$/.test(str.trim())) return Number(str);
  if (str === '' && isNumType(type)) return null;
  return str;
}

/* ---------- sample database ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildSample() {
  const r = rng(42), pick = a => a[Math.floor(r() * a.length)], int = (a, b) => a + Math.floor(r() * (b - a + 1));
  const day = (start, n) => { const d = new Date(start + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  db.run(`
  CREATE TABLE customers (id INTEGER PRIMARY KEY, first_name TEXT NOT NULL, last_name TEXT NOT NULL, email TEXT UNIQUE, city TEXT, signup_date TEXT);
  CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL, category TEXT NOT NULL, price REAL NOT NULL);

function generateRows(table, n) {

  const personTable = /user|customer|person|people|employee|member|author|student|contact|client/i.test(table);
  const dateIn = (yrs) => { const d = new Date(Date.now() - r() * yrs * 365 * 864e5); return d.toISOString().slice(0, 10); };

    else if (/(last|sur|family)_?name|^lname$/.test(nm)) v = pick(LAST);
    else if (/e?mail/.test(nm)) v = `${pick(FIRST)}.${pick(LAST)}${u ? k : int(1, 99)}@example.com`.toLowerCase();
    else if (/phone|mobile/.test(nm)) v = `+1-${int(200, 989)}-555-${String(int(0, 9999)).padStart(4, '0')}`;
    else if (/^name$|full_?name/.test(nm)) v = personTable ? `${pick(FIRST)} ${pick(LAST)}` : /compan|org|dept|department|vendor|supplier/i.test(table) ? pick(COMPANY) : /product|item|goods/i.test(table) ? pick(PRODUCT) : `${pick(WORDS)} ${pick(WORDS)}`;

    else if (/country/.test(nm)) v = pick(COUNTRY);
    else if (/address|street/.test(nm)) v = `${int(1, 999)} ${pick(WORDS)} St`;
    else if (/zip|postal/.test(nm)) v = String(int(10000, 99999));
    else if (/url|website|link/.test(nm)) v = `https://example.com/${pick(WORDS)}/${int(1, 999)}`;
    else if (/uuid|guid/.test(nm)) v = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${k}`;
    else if (/title|position|role|job/.test(nm)) v = pick(TITLES);
    else if (/status|state$|stage/.test(nm)) v = pick(STATUS);
    else if (/categor|genre|type|kind|segment/.test(nm)) v = pick(CATEGORY);
    else if (/desc|note|comment|body|text|bio|summary/.test(nm)) v = `${pick(WORDS)} ${pick(WORDS)} ${pick(WORDS)} ${pick(WORDS)} ${pick(WORDS)}.`;
    else if (/birth|dob/.test(nm)) v = dateIn(50);
    else if (/(_at|time|timestamp)$/.test(nm)) v = dateIn(2) + ' ' + String(int(0, 23)).padStart(2, '0') + ':' + String(int(0, 59)).padStart(2, '0') + ':' + String(int(0, 59)).padStart(2, '0');
    else if (/date|^day$|_on$/.test(nm)) v = dateIn(2);
    else if (/^(is|has|can)_|active|enabled|verified|flag/.test(nm)) v = int(0, 1);
    else if (/salary|wage|income/.test(nm)) v = Math.round(int(40000, 180000) / 500) * 500;
    else if (/price|amount|total|cost|fee|balance|revenue/.test(nm)) v = Math.round((5 + r() * 495) * 100) / 100;
    else if (/qty|quantity|count|stock|units|number_of/.test(nm)) v = int(1, 20);
    else if (/^age$/.test(nm)) v = int(18, 80);
    else if (/rating|score|stars/.test(nm)) v = /int/i.test(c.type) ? int(1, 5) : Math.round((1 + r() * 4) * 10) / 10;
    else if (/year/.test(nm)) v = int(1990, 2025);
    else if (/percent|pct|rate/.test(nm)) v = int(0, 100);
    else if (/int|bool/i.test(c.type || '')) v = u ? k : int(1, 1000);
    else if (/real|floa|doub|num|dec/i.test(c.type || '')) v = Math.round(r() * 100000) / 100;
    else v = `${pick(WORDS)} ${pick(WORDS)}`;

}

  let done = false;

/* table designer */
let des;
const TYPES = ['INTEGER', 'TEXT', 'REAL', 'NUMERIC', 'BLOB', 'BOOLEAN', 'DATE', 'DATETIME'];
function designSql(d) {
  const named = d.cols.filter(c => c.name.trim()), pks = named.filter(c => c.pk), single = pks.length === 1;
  const lines = named.map(c => {
    let s = `  ${q(c.name.trim())} ${c.type}`;
    if (single && c.pk) s += ' PRIMARY KEY'; if (c.nn && !c.pk) s += ' NOT NULL'; if (c.uq && !c.pk) s += ' UNIQUE';
    const df = c.def.trim(); if (df !== '') s += ' DEFAULT ' + (/^-?\d+(\.\d+)?$/.test(df) || /^(NULL|CURRENT_TIMESTAMP|CURRENT_DATE|TRUE|FALSE)$/i.test(df) ? df : lit(df));
    if (c.ref) s += ` REFERENCES ${c.ref}`; return s;
  });
  if (pks.length > 1) lines.push(`  PRIMARY KEY (${pks.map(c => q(c.name.trim())).join(', ')})`);
  return `CREATE TABLE ${q(d.name.trim() || 'table_name')} (\n${lines.join(',\n')}\n);`;
}
function designerDialog() {
  des = { name: '', cols: [{ name: 'id', type: 'INTEGER', pk: true, nn: false, uq: false, def: '', ref: '' }, { name: '', type: 'TEXT', pk: false, nn: false, uq: false, def: '', ref: '' }] };

  const refs = rowsOf("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").map(r => { const pk = tableInfo(r[0]).cols.find(c => c.pk); return pk ? { label: `${r[0]}(${pk.name})`, value: `${q(r[0])}(${q(pk.name)})` } : null; }).filter(Boolean);
  const draw = () => {
    $('#d-rows').innerHTML = des.cols.map((c, i) => `<tr><td><input type="text" data-i="${i}" data-k="name" value="${esc(c.name)}" placeholder="column_name" aria-label="Column name"></td>
      <td><select data-i="${i}" data-k="type" aria-label="Type">${TYPES.map(t => `<option ${t === c.type ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-i="${i}" data-k="pk" ${c.pk ? 'checked' : ''} aria-label="Primary key"></td><td><input type="checkbox" data-i="${i}" data-k="nn" ${c.nn ? 'checked' : ''} aria-label="Not null"></td><td><input type="checkbox" data-i="${i}" data-k="uq" ${c.uq ? 'checked' : ''} aria-label="Unique"></td>
      <td><input type="text" data-i="${i}" data-k="def" value="${esc(c.def)}" aria-label="Default"></td>
      <td><select data-i="${i}" data-k="ref" aria-label="References"><option value="">—</option>${refs.map(r => `<option value="${esc(r.value)}" ${r.value === c.ref ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></td>
      <td><button class="btn sm" data-rm="${i}" aria-label="Remove column">✕</button></td></tr>`).join('');
    prev();

    if (el.dataset.k === undefined) return; const c = des.cols[+el.dataset.i];

/* import */
function parseCSV(text, delim = ',') {
  const rows = []; let row = [], f = '', qt = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (qt) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else qt = false; } else f += c; }
    else if (c === '"') qt = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function detectDelim(text) { const line = text.split(/\r?\n/).find(l => l.trim()) || '', n = ch => line.split(ch).length; return n('\t') > n(',') && n('\t') >= n(';') ? '\t' : n(';') > n(',') ? ';' : ','; }
function jsonToRows(text) {
  let j = JSON.parse(text); if (!Array.isArray(j)) { const k = Object.keys(j).find(k => Array.isArray(j[k])); j = k ? j[k] : [j]; }
  const keys = []; j.forEach(o => Object.keys(o || {}).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  return [keys, ...j.map(o => keys.map(k => { const v = o?.[k]; return v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); }))];
}
function textToRows(name, text) { text = text.replace(/^﻿/, ''); return /\.json$/i.test(name) || /^\s*[\[{]/.test(text) ? jsonToRows(text) : parseCSV(text, detectDelim(text)); }
const impMsg = t => { const m = $('#import-msg'); if (m) m.textContent = t; say(t); };
function importRows(name, rows) {
  if (rows.length < 1) { impMsg(`${name} is empty`); return null; }
  let table = name.replace(/[^A-Za-z0-9_]+/g, '_').replace(/^(\d)/, '_$1').toLowerCase() || 'imported';
  const base = table; let k = 2; while (scalar(`SELECT 1 FROM sqlite_master WHERE name = ${lit(table)}`)) table = `${base}_${k++}`;
  const header = rows[0].map((h, i) => h.trim() || `col${i + 1}`), data = rows.slice(1);
  const types = header.map((_, i) => { const vals = data.map(r => (r[i] ?? '').trim()).filter(v => v !== ''); if (!vals.length) return 'TEXT'; if (vals.every(v => /^-?\d+$/.test(v))) return 'INTEGER'; if (vals.every(v => /^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(v))) return 'REAL'; return 'TEXT'; });
  try {
    db.run('BEGIN'); db.run(`CREATE TABLE ${q(table)} (${header.map((h, i) => `${q(h)} ${types[i]}`).join(', ')})`);
    const st = db.prepare(`INSERT INTO ${q(table)} VALUES (${header.map(() => '?').join(',')})`);
    for (const r of data) st.run(header.map((_, i) => { const v = (r[i] ?? '').trim(); return v === '' ? null : types[i] === 'TEXT' ? v : Number(v); }));
    st.free(); db.run('COMMIT');
  } catch (e) { try { db.run('ROLLBACK'); } catch { } impMsg('Import failed: ' + e.message); return null; }
  return { table, count: data.length };
}
function finishImport(results) {
  scheduleSave(); schemaChanged();
  const ok = results.filter(Boolean); if (!ok.length) return;
  impMsg('Loaded ' + ok.map(r => r.script ? r.script : `${r.table} (${r.count} rows)`).join(', '));
  const last = ok.filter(r => r.table).pop(); if (last) { expanded.add(last.table); closeModal(); openTable(last.table); } else closeModal();
}
async function loadFiles(files) {
  const results = [];
  for (const file of files) {
    try {
      if (/\.(sqlite3?|db)$/i.test(file.name)) { db.close(); db = new SQL.Database(new Uint8Array(await file.arrayBuffer())); db.exec('SELECT 1 FROM sqlite_master'); db.run('PRAGMA foreign_keys = ON'); results.push({ script: file.name }); }
      else {
        const text = await file.text();
        if (/\.sql$/i.test(file.name)) { const r = runStatements(text), e = r.find(x => x.error); if (e) { impMsg(`${file.name}: ${e.error}`); continue; } results.push({ script: file.name }); }
        else results.push(importRows(file.name.replace(/\.[^.]+$/, ''), textToRows(file.name, text)));
      }
    } catch (e) { impMsg(`${file.name}: ${e.message}`); }
  }
  finishImport(results);
}
$('#b-import').onclick = () => {
  openModal('Import data', `<p class="note">CSV, TSV and JSON files become tables named after the file (first row = column names, types guessed). A .sql file runs as a script. A .sqlite or .db file replaces the whole database.</p>
    <div class="drop" id="drop">Drop files here or <label style="color:var(--accent);cursor:pointer;text-decoration:underline">choose files<input type="file" id="imp-file" multiple accept=".csv,.tsv,.txt,.json,.sql,.sqlite,.sqlite3,.db" hidden></label></div>
    <div class="eyebrow">Or paste data</div>
    <div class="row"><label class="l" style="flex:1;min-width:160px">Table name<input type="text" id="paste-name" value="my_data"></label></div>
    <textarea class="field" id="paste-box" rows="6" spellcheck="false" placeholder="name,age,city&#10;Ana,31,Lisbon&#10;Ben,27,Oslo" style="font-family:var(--font-mono);font-size:12.5px;resize:vertical;width:100%"></textarea>
    <div class="row"><button class="btn primary" id="paste-go">Create table from pasted data</button><button class="btn" id="imp-cancel">Cancel</button></div><p class="note" id="import-msg" role="status"></p>`);
  $('#imp-cancel').onclick = closeModal;
  $('#imp-file').onchange = e => { loadFiles([...e.target.files]); };
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => loadFiles([...e.dataTransfer.files]));
  $('#paste-go').onclick = () => {
    const text = $('#paste-box').value.trim(); if (!text) { impMsg('Paste some data first.'); return; }
    try { finishImport([importRows($('#paste-name').value.trim() || 'my_data', textToRows('paste', text))]); } catch (e) { impMsg('Could not read that: ' + e.message); }
  };
};

/* export, samples */
function dumpSql() {
  const out = ['-- Sandbox database dump', 'BEGIN TRANSACTION;'];
  const objs = rowsOf("SELECT type, name, sql FROM sqlite_master WHERE sql IS NOT NULL AND name NOT LIKE 'sqlite_%' ORDER BY CASE type WHEN 'table' THEN 0 WHEN 'index' THEN 2 ELSE 3 END, name");
  objs.filter(o => o[0] === 'table').forEach(o => out.push(o[2] + ';'));
  objs.filter(o => o[0] === 'table').forEach(o => {
    const rows = rowsOf(`SELECT * FROM ${q(o[1])}`); if (!rows.length) return;
    const cols = tableInfo(o[1]).cols.map(c => q(c.name)).join(', ');
    out.push('', `-- ${o[1]}: ${rows.length} rows`); rows.forEach(r => out.push(`INSERT INTO ${q(o[1])} (${cols}) VALUES (${r.map(lit).join(', ')});`));
  });
  const rest = objs.filter(o => o[0] !== 'table'); if (rest.length) { out.push(''); rest.forEach(o => out.push(o[2] + ';')); }
  out.push('COMMIT;'); return out.join('\n');
}
$('#b-dump').onclick = () => { const s = dumpSql(); const t = newQuery(s, 'Dump'); say('Full database as SQL. Copy it to back up or move your data.'); copyText(s, 'Dump opened in a tab and copied to the clipboard'); };
$('#b-sample').onclick = () => {
  openModal('Sample databases', `<p class="note">Loading one replaces everything in the current database.</p>
    <div class="choice"><button data-s="shop"><b>Shop & company</b><span>customers, products, orders, order_items, departments, employees. About 400 rows.</span></button>
    <button data-s="library"><b>Library</b><span>authors, books, members, loans. A small set to learn joins on.</span></button>
    <button data-s="empty"><b>Empty database</b><span>Start from nothing and create your own tables.</span></button></div><p class="note" id="sm-msg"></p>`);
  $('#dlg-body').onclick = e => {
    const b = e.target.closest('button[data-s]'); if (!b) return;
    if (!b.dataset.sure) { document.querySelectorAll('#dlg-body button[data-s]').forEach(x => delete x.dataset.sure); b.dataset.sure = '1'; $('#sm-msg').textContent = 'This replaces all current tables. Click again to confirm.'; return; }
    db.close(); db = new SQL.Database(); db.run('PRAGMA foreign_keys = ON');
    if (b.dataset.s === 'shop') buildSample(); else if (b.dataset.s === 'library') buildLibrary();
    scheduleSave(); expanded.clear(); closeModal(); schemaChanged(); say(`Loaded: ${b.querySelector('b').textContent}`);
  };
};

/* ---------- boot ---------- */
async function boot() {
  SQL = await initSqlJs();
  let restored = false;
  try { const saved = await idbGet('db'); if (saved) { db = new SQL.Database(saved); db.exec('SELECT 1 FROM sqlite_master'); restored = true; } } catch { db = null; }
  if (!restored) { try { const b64 = store.get('sqllab.db.v1'); if (b64) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); db = new SQL.Database(u); restored = true; } } catch { db = null; } }
  if (!restored) { db = new SQL.Database(); db.run('PRAGMA foreign_keys = ON'); buildSample(); scheduleSave(); } else db.run('PRAGMA foreign_keys = ON');
  $('#st-ver').textContent = 'SQLite ' + scalar('SELECT sqlite_version()');
  say(restored ? 'Restored your saved database' : 'Loaded the sample shop & company database');
  try { const s = JSON.parse(store.get('sbx.tabs') || 'null'); if (s && s.q.length) { s.q.forEach(x => tabs.push({ id: x.id, type: 'query', title: x.title, sql: x.sql, results: [], otab: 'results' })); nextId = s.n; qCounter = s.c; } } catch { }
  if (!tabs.length) {
    const hasCust = tableExists('customers');
    tabs.push({ id: 't' + nextId++, type: 'query', title: 'Query ' + (++qCounter), results: [], otab: 'results', sql: `-- Write SQL here. Ctrl/⌘ + Enter runs it (or only the selected text).\n-- Click a table on the left to browse and edit its rows.\n\n${hasCust ? 'SELECT c.first_name, c.last_name, COUNT(o.id) AS orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id\nORDER BY orders DESC\nLIMIT 10;' : "SELECT name, type FROM sqlite_master WHERE name NOT LIKE 'sqlite_%';"}` });
  }
  activeId = tabs[0].id; activate(activeId);
  if (!restored && tableExists('customers')) runQuery();
}
boot().catch(e => { $('#outbody').innerHTML = `<div class="msgs"><div class="err">Couldn’t start SQLite: ${esc(e.message || e)}. Check your connection and reload.</div></div>`; });
})();
</script>
